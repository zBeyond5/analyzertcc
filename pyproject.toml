[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-analyzer"
version = "0.1.0"
description = "Análise bivariada local para pesquisa acadêmica"
requires-python = ">=3.12,<3.13"
dependencies = ["streamlit", "pandas", "numpy", "scipy", "statsmodels", "openpyxl", "PyYAML", "python-docx", "matplotlib", "reportlab", "xlrd", "plotly==7.1.0"]

[project.optional-dependencies]
dev = ["pytest", "playwright", "pypdf", "pymupdf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
