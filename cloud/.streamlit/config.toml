[server]
address = "0.0.0.0"
port = 8501
headless = true
enableXsrfProtection = true
enableCORS = true
enableStaticServing = false
maxUploadSize = 20
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
font = "sans serif"
baseRadius = "0.65rem"
buttonRadius = "0.65rem"

[theme.light]
primaryColor = "#216C72"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F5F5"
textColor = "#203B43"
borderColor = "#D7E2E3"

[theme.dark]
primaryColor = "#88CDD0"
backgroundColor = "#141F29"
secondaryBackgroundColor = "#20313D"
textColor = "#EBF2F4"
borderColor = "#49616C"
