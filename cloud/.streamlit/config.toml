[server]
address = "0.0.0.0"
port = 8501
headless = true
enableXsrfProtection = true
enableCORS = true
enableStaticServing = false
maxUploadSize = 20
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F6675"
backgroundColor = "#F7FAFC"
secondaryBackgroundColor = "#EAF0F3"
textColor = "#173441"
font = "sans serif"
