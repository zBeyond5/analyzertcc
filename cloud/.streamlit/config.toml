[server]
address = "0.0.0.0"
port = 8501
headless = true
enableXsrfProtection = true
enableCORS = true
enableStaticServing = false
maxUploadSize = 20
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
font = "sans serif"
baseRadius = "0.875rem"
buttonRadius = "0.875rem"

[theme.light]
primaryColor = "#216C72"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F5F5"
textColor = "#203B43"
borderColor = "#D7E2E3"

[theme.dark]
primaryColor = "#86CDD1"
backgroundColor = "#0F1B24"
secondaryBackgroundColor = "#17262F"
textColor = "#E8F1F2"
borderColor = "#49616C"
